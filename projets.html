<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projets — Adam Fournier</title>
  <link rel="stylesheet" href="index.css?v=300" />
</head>
<body>

  <header class="board">
    <div class="board__inner">
      <div class="board__brand">Adam&nbsp;Fournier</div>
      <nav class="board__nav">
        <a href="index.html">Accueil</a>
        <a href="stages.html">Stages</a>
        <a href="projets.html" class="is-active">Projets</a>
        <a href="engagements.html">Engagements</a>
      </nav>
    </div>
  </header>

  <div class="slides-full-wrap">
    <div class="slides-full" id="slider">
      <section class="slide-full"><div class="slide-content"><h1>Projet 1</h1><p>Simulation système embarqué.</p></div></section>
      <section class="slide-full"><div class="slide-content"><h1>Projet 2</h1><p>Commande moteur et PID.</p></div></section>
      <section class="slide-full"><div class="slide-content"><h1>Projet 3</h1><p>Analyse de données capteurs.</p></div></section>
    </div>
  </div>

  <div class="arrows"><button class="arrow-btn" id="prev">‹</button><button class="arrow-btn" id="next">›</button></div>

  <div class="progress"><div class="progress__bar" id="progressBar"></div></div>
  <div class="pagination-ui">
    <div class="dots" id="dots"></div>
    <div class="counter" id="counter">1 / 3</div>
  </div>

  <script>
    let current=0;const slides=document.getElementById('slider');const total=slides.children.length;
    const dots=document.getElementById('dots');for(let i=0;i<total;i++){const b=document.createElement('button');b.className='dot'+(i===0?' is-active':'');b.onclick=()=>{current=i;update()};dots.appendChild(b);}
    const progressBar=document.getElementById('progressBar'),counter=document.getElementById('counter');
    function update(){slides.style.transform=`translateX(-${current*100}vw)`;[...document.querySelectorAll('.dot')].forEach((d,idx)=>d.classList.toggle('is-active',idx===current));counter.textContent=`${current+1} / ${total}`;progressBar.style.width=`${((current+1)/total)*100}%`;}
    document.getElementById('next').onclick=()=>{current=(current+1)%total;update();};
    document.getElementById('prev').onclick=()=>{current=(current-1+total)%total;update();};
    update();
  </script>
</body>
</html>
