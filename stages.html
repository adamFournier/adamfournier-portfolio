<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stages — Adam Fournier</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=124" />
  <style>
    /* ===== Mise en page générale ===== */
    .slide-intro {
      text-align: center;
      padding-top: 50px;
    }

    .intro h1 {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #79d2f2, #2aa8d8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .intro__lead {
      margin: 0 auto 50px;
      max-width: 820px;
      color: #cbd8ea;
      font-size: 17px;
      line-height: 1.7;
    }

    /* ===== Grille des cartes ===== */
    .intro-grid {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 30px;
      flex-wrap: wrap;
      margin-top: 10px;
      margin-bottom: 60px;
    }

    .intro-card {
      width: 280px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 22px 20px 24px;
      text-align: left;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .intro-card:hover {
      transform: translateY(-6px);
      border-color: rgba(120,200,255,0.5);
      box-shadow: 0 10px 25px rgba(42,168,216,0.3);
      background: rgba(255,255,255,0.09);
    }

    .intro-card__title {
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .intro-card__subtitle {
      color: #cbd8ea;
      font-size: 14.5px;
      margin-bottom: 10px;
    }

    .meta-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      font-size: 12.5px;
      color: #dfe9ff;
      opacity: 0.95;
    }

    .pill svg {
      width: 14px;
      height: 14px;
      opacity: .9;
    }

    /* ===== Cartes vides ===== */
    .intro-card--empty {
      cursor: default;
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.18);
      opacity: 0.6;
      text-align: center;
    }

    .intro-card--empty:hover {
      transform: none;
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.18);
      box-shadow: none;
    }

    @media (max-width: 900px) {
      .intro h1 { font-size: 34px; }
      .intro__lead { font-size: 15.5px; margin-bottom: 40px; }
      .intro-card { width: 100%; max-width: 320px; }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="board">
    <div class="board__inner">
      <div class="board__brand">Adam&nbsp;Fournier</div>
      <nav class="board__nav">
        <a href="index.html">Accueil</a>
        <a href="stages.html" class="is-active">Stages</a>
        <a href="projets.html">Projets</a>
        <a href="engagements.html">Engagements</a>
      </nav>
    </div>
  </header>

  <!-- CONTENU -->
  <section class="slide-full slide-intro">
    <div class="slide-content intro">
      <h1>Mes stages</h1>
      <p class="intro__lead">
        Pour le moment, j’ai effectué mon <strong>stage de première année</strong> chez 
        <strong>Enedis</strong>, au <strong>pôle Data</strong> de la <strong>DSI</strong> à 
        <strong>Paris</strong>, en tant que <strong>Data Analyst</strong> pendant <strong>3 mois</strong>.
      </p>

      <div class="intro-grid">
        <!-- Stage Enedis -->
        <button class="intro-card" onclick="window.location.href='stage-enedis.html'">
          <div class="intro-card__title">Enedis — Paris</div>
          <div class="intro-card__subtitle">Data Analyst — Pôle Data / DSI</div>
          <div class="meta-row">
            <span class="pill">
              <!-- icône calendrier -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 7V3m8 4V3M3 11h18M5 20h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2z"/>
              </svg>
              3&nbsp;mois
            </span>
          </div>
        </button>

        <!-- Stage 2 -->
        <div class="intro-card intro-card--empty">
          <div class="intro-card__title">Stage&nbsp;#2</div>
        </div>

        <!-- Stage 3 -->
        <div class="intro-card intro-card--empty">
          <div class="intro-card__title">Stage&nbsp;#3</div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
